name: Cloudflare Automated Rebuild & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Build & Verify All Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run OpenAPI Contract Tests
        run: node tests/contract/contract_test.js

      - name: Run Full B2B Trade E2E Invariant Tests
        run: node tests/e2e/e2e_full_cycle.js

      - name: TypeScript Type-check API Worker
        run: npm --prefix apps/api-worker run build

      - name: Build All Frontends (Buyer, Partner, Admin, Root Dist)
        run: |
          npm run build:buyer
          npm run build:partner
          npm run build:admin
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 1

  deploy-cloudflare:
    name: Deploy to Cloudflare Workers & Assets
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Deploy Cloudflare API Worker (wholesale-api)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6d53e0a853ad74dec5fefcd4b4600e3a' }}
          workingDirectory: 'apps/api-worker'
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6d53e0a853ad74dec5fefcd4b4600e3a' }}
        continue-on-error: true

      - name: Deploy Cloudflare Frontend (wholesale)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6d53e0a853ad74dec5fefcd4b4600e3a' }}
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '6d53e0a853ad74dec5fefcd4b4600e3a' }}
        continue-on-error: true

