openapi: 3.0.3
info:
  title: Wholesale B2B Core API
  version: 1.0.0
  description: Alibaba.com 도매 거래 구조 기반 엔터프라이즈 B2B 플랫폼 핵심 API 계약
servers:
  - url: https://api.wholesale.internal/v1
    description: Production API
  - url: http://localhost:8080/v1
    description: Local Development Server

paths:
  /auth/register:
    post:
      summary: 신규 회원가입 및 초기 기업 등록
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails'

  /auth/login:
    post:
      summary: 사용자 로그인 및 JWT 세션 발급
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /auth/me:
    get:
      summary: 현재 로그인 사용자 프로필 및 소속 기업 목록 조회
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /organizations/{id}/verifications:
    post:
      summary: 기업 실사 및 공급사 인증 신청 (사업자등록증, 공장인증 등)
      operationId: submitVerification
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequestInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRecord'

  /catalog/listings:
    get:
      summary: 상품 카탈로그 검색 및 필터링 (구간단가, MOQ, 인증 포함)
      operationId: listProducts
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: min_moq
          in: query
          schema:
            type: string
        - name: verified_only
          in: query
          schema:
            type: boolean
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingListResponse'
    post:
      summary: 공급사 상품 및 구간별 단가표(Price Tiers) 신규 등록
      operationId: createListing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetail'

  /catalog/listings/{id}:
    get:
      summary: 상품 상세 조회 (SKU 매트릭스, MOQ, 수량별 단가표, 샘플 조건)
      operationId: getListingDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetail'

  /sourcing/rfqs:
    get:
      summary: 공개 RFQ 시장 목록 조회
      operationId: listRFQs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFQListResponse'
    post:
      summary: 구매자 견적 요청서(RFQ) 발행
      operationId: createRFQ
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRFQRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFQDetail'

  /sourcing/rfqs/{id}/quotes:
    post:
      summary: 공급사 견적서(Quote) 발행 및 버전 갱신
      operationId: createQuote
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'

  /sourcing/quotes/{id}/accept:
    post:
      summary: 견적서 수락 및 도매 주문/계약 원자적 생성
      operationId: acceptQuote
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'

  /trade/orders:
    get:
      summary: 내 기업의 주문 목록 조회
      operationId: listOrders
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /trade/orders/{id}:
    get:
      summary: 주문 상세, 분할 결제 일정, 생산/검수/배송 타임라인 조회
      operationId: getOrderDetail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'

  /trade/orders/{id}/contract/sign:
    post:
      summary: 무역 계약서 전자 서명 (해시 검증)
      operationId: signTradeContract
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignContractRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractSignatureResult'

  /payments/process:
    post:
      summary: 분할 결제 스케줄에 따른 결제 승인 요청
      operationId: processPayment
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'

  /payments/webhook:
    post:
      summary: PG 웹훅 수신 및 복식원장 분개 반영
      operationId: handlePaymentWebhook
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PGWebhookPayload'
      responses:
        '200':
          description: 웹훅 수신 완료

  /logistics/shipments:
    post:
      summary: 공급사 분할 선적/출고 등록
      operationId: createShipment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentDetail'

  /settlements/runs:
    post:
      summary: 플랫폼 정산 배치 실행 및 대사
      operationId: executeSettlementRun
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementRunResult'

  /disputes:
    post:
      summary: 거래 분쟁 제기 및 정산 동결
      operationId: openDispute
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenDisputeRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeDetail'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - company_name
        - business_number
        - role_capability
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        company_name:
          type: string
        business_number:
          type: string
        country:
          type: string
          example: KR
        role_capability:
          type: string
          enum: [BUYER, SUPPLIER, BOTH]

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        active_organization_id:
          type: string
          format: uuid
        role:
          type: string

    VerificationRequestInput:
      type: object
      required:
        - business_license_url
        - representative_name
        - business_type
      properties:
        business_license_url:
          type: string
        representative_name:
          type: string
        business_type:
          type: string
          enum: [MANUFACTURER, TRADING_COMPANY, OEM_ODM]
        tax_id:
          type: string

    VerificationRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        submitted_at:
          type: string
          format: date-time

    CreateListingRequest:
      type: object
      required:
        - title
        - category_id
        - moq
        - quantity_step
        - unit
        - price_tiers
      properties:
        title:
          type: string
        category_id:
          type: string
          format: uuid
        moq:
          type: string
          description: numeric(20,6) string format
          example: "100"
        quantity_step:
          type: string
          example: "10"
        unit:
          type: string
          example: "pcs"
        price_tiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTierInput'

    PriceTierInput:
      type: object
      required:
        - min_quantity
        - unit_price
        - currency
      properties:
        min_quantity:
          type: string
          example: "100"
        max_quantity:
          type: string
          nullable: true
          example: "499"
        unit_price:
          type: string
          description: numeric(20,6) string format
          example: "12.500000"
        currency:
          type: string
          example: "USD"

    ListingDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        supplier_id:
          type: string
          format: uuid
        supplier_name:
          type: string
        is_verified_supplier:
          type: boolean
        moq:
          type: string
        quantity_step:
          type: string
        unit:
          type: string
        price_tiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTierInput'

    ListingListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListingDetail'
        next_cursor:
          type: string
          nullable: true

    CreateRFQRequest:
      type: object
      required:
        - title
        - destination_country
        - items
        - expires_at
      properties:
        title:
          type: string
        destination_country:
          type: string
        expires_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              product_name:
                type: string
              specifications:
                type: string
              quantity:
                type: string
              unit:
                type: string
              target_price_minor:
                type: string

    RFQDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        items_count:
          type: integer

    RFQListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RFQDetail'

    CreateQuoteRequest:
      type: object
      required:
        - rfq_id
        - lines
        - incoterms
        - lead_time_days
        - valid_until
      properties:
        rfq_id:
          type: string
          format: uuid
        incoterms:
          type: string
          example: "FOB Busan"
        lead_time_days:
          type: integer
        valid_until:
          type: string
          format: date-time
        lines:
          type: array
          items:
            type: object
            properties:
              rfq_item_id:
                type: string
                format: uuid
              unit_price:
                type: string
              quantity:
                type: string
              currency:
                type: string

    QuoteDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rfq_id:
          type: string
          format: uuid
        revision_number:
          type: integer
        status:
          type: string
        total_amount_minor:
          type: string
        currency:
          type: string

    OrderCreatedResponse:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        order_number:
          type: string
        status:
          type: string
        total_amount_minor:
          type: string

    OrderDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
        status:
          type: string
        payment_status:
          type: string
        total_amount_minor:
          type: string
        currency:
          type: string
        payment_schedules:
          type: array
          items:
            type: object
            properties:
              schedule_type:
                type: string
                enum: [DOWN_PAYMENT, MILESTONE, BALANCE]
              amount_minor:
                type: string
              status:
                type: string

    OrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderDetail'

    SignContractRequest:
      type: object
      required:
        - document_hash
        - signature_payload
      properties:
        document_hash:
          type: string
        signature_payload:
          type: string

    ContractSignatureResult:
      type: object
      properties:
        contract_id:
          type: string
          format: uuid
        signed:
          type: boolean
        signed_at:
          type: string
          format: date-time

    ProcessPaymentRequest:
      type: object
      required:
        - schedule_id
        - payment_method
      properties:
        schedule_id:
          type: string
          format: uuid
        payment_method:
          type: string
          enum: [CARD, WIRE_TRANSFER, ESCROW_ACCOUNT]

    PaymentResult:
      type: object
      properties:
        payment_id:
          type: string
          format: uuid
        status:
          type: string
        amount_minor:
          type: string
        currency:
          type: string

    PGWebhookPayload:
      type: object
      required:
        - event_id
        - event_type
        - transaction_id
        - amount_minor
        - currency
      properties:
        event_id:
          type: string
        event_type:
          type: string
        transaction_id:
          type: string
        amount_minor:
          type: string
        currency:
          type: string

    CreateShipmentRequest:
      type: object
      required:
        - order_id
        - tracking_number
        - carrier
        - items
      properties:
        order_id:
          type: string
          format: uuid
        tracking_number:
          type: string
        carrier:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              order_item_id:
                type: string
                format: uuid
              shipped_quantity:
                type: string

    ShipmentDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        tracking_number:
          type: string
        status:
          type: string

    SettlementRunResult:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        settled_count:
          type: integer
        total_payout_minor:
          type: string

    OpenDisputeRequest:
      type: object
      required:
        - order_id
        - reason
        - claimed_amount_minor
      properties:
        order_id:
          type: string
          format: uuid
        reason:
          type: string
        claimed_amount_minor:
          type: string

    DisputeDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        status:
          type: string
        freeze_active:
          type: boolean

  responses:
    ProblemDetails:
      description: RFC 7807 에러 응답
      content:
        application/problem+json:
          schema:
            type: object
            required:
              - type
              - title
              - status
              - code
              - request_id
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
              code:
                type: string
              request_id:
                type: string
              field_errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string
