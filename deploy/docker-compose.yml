services:
  postgres:
    image: postgres:17-alpine
    container_name: wholesale-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wholesale}
      POSTGRES_USER: ${POSTGRES_USER:-wholesale_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wholesale_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial.sql:ro
      - ../db/migrations/002_tenant_security.sql:/docker-entrypoint-initdb.d/02_security.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale_admin -d wholesale"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wholesale-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: wholesale-api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://wholesale_admin:wholesale_secure_pass_2026@postgres:5432/wholesale?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:

